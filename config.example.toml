# InkFrame settings. install.sh copies this to config.toml, which git ignores.
# Restart after editing:  sudo systemctl restart inkframe

[app]
start_mode = "weather"          # "weather", "slideshow", "potd" or "calendar" (the last mode used wins after a restart)

[display]
saturation = 0.5                # 0..1; higher = punchier colours in photos
rotate = 0                      # 180 = upside down; 90 or 270 = portrait (if 90 is upside down, use 270)
panel = "auto"                  # "auto" detects the board; or "spectra73" (7.3" 2025, 6 colours),
                                # "impression73-7colour" (7.3" 2023) or "impression57" (5.7")
clean_every = 48                # clean cycle every N refreshes to limit ghosting (0 = never)
quiet_hours = []                # e.g. [23, 7] skips timed refreshes from 23:00 to 07:00

[buttons]
enabled = true
# pins = { A = 5, B = 6, C = 16, D = 24 }   # BCM numbers; on the 13.3" button C is 25

[web]                           # control page: http://<pi-address>:8080
enabled = true
port = 8080
host = "0.0.0.0"                # anyone on your network can use it; "127.0.0.1" for the Pi only

[weather]
latitude = 40.7128              # set these to your location
longitude = -74.0060
location_name = "Home"          # shown in the header; "" to hide
units = "imperial"              # or "metric"
interval_minutes = 30

[slideshow]
folder = "~/Pictures/inkframe"  # subfolders are included
# The web page can pick a folder, order, interval and fit; once it has, its choices win
# over interval_minutes and fit here.
interval_minutes = 15
fit = "crop"                    # "crop" fills the screen; "fit" shows the whole photo with white bars
colour_boost = 1.3              # extra saturation before dithering (1.0 = off)
contrast_boost = 1.1

[calendar]                      # button D (hold D to clean the screen)
# Google Calendar: calendar.google.com > Settings > pick the calendar under
# "Settings for my calendars" > Integrate calendar > "Secret address in iCal format".
# Treat that link like a password: anyone with it can read the calendar.
sources = [
  # "https://calendar.google.com/calendar/ical/.../basic.ics",
  # { url = "https://calendar.google.com/calendar/ical/.../basic.ics", colour = "green" },
]
days = 7                        # how many days ahead to list
week_start = "sunday"           # or "monday"
interval_minutes = 5            # how often to check; only redraws when something changed

[potd]                          # Wikimedia Commons picture of the day (button C)
interval_minutes = 60           # how often to check for a new day's picture
caption = true                  # title and credit strip along the bottom
language = "en"
fit = "auto"                    # "auto" crops unless that would cut off a lot
colour_boost = 1.2
contrast_boost = 1.1
